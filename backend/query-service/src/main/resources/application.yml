server:
  port: 8082

spring:
  application:
    name: query-service
  data:
    mongodb:
      host: localhost
      port: 27017
      database: productos_db
  security:
    oauth2:
      resourceserver:
        jwt:
          # Puedes usar SOLO issuer-uri (recomendado). Spring descubrirá el JWKS.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}}
          # Si prefieres fijar JWKS directamente, usa jwk-set-uri (usa uno u otro, no ambos):
          # jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/arquitecturaTI/protocol/openid-connect/certs}

# ✅ Kafka Configuration optimizada
spring.kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: query-service-group-v2
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # ✅ Configuraciones para mejor rendimiento
    enable-auto-commit: true
    auto-commit-interval: 1000
    max-poll-records: 500
    session-timeout-ms: 30000
    heartbeat-interval-ms: 3000

# ✅ JWT Configuration
#jwt:
#  secret: ${JWT_SECRET:tu-clave-super-segura-de-al-menos-32-caracteres-para-desarrollo}
#  expiration: ${JWT_EXPIRATION:3600000}



# ✅ Observability Configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,tracing"
        exclude: "env,configprops"
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      access: read_only
    prometheus:
      access: read_only

  # ✅ OpenTelemetry Tracing
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  # ✅ W3C Trace Context
  propagation:
    type: w3c

  # ✅ OTLP Export Configuration
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      timeout: 10s
      compression: gzip
      headers:
        service-name: query-service
        service-version: 1.0.0

  # ✅ Prometheus Metrics
  prometheus:
    metrics:
      export:
        enabled: true

# ✅ Structured Logging Configuration
logging:
  level:
    root: INFO
    com.example.query_service: DEBUG
    org.springframework.security: WARN

    # ✅ Reduce OpenTelemetry noise
    io.opentelemetry: WARN
    io.opentelemetry.exporter: ERROR
    io.grpc: WARN
    okhttp3: ERROR

    # ✅ Database y Kafka logging
    org.springframework.kafka: WARN
    org.mongodb.driver: WARN
    org.apache.kafka.clients: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

---
# ✅ Development Profile
spring:
  config:
    activate:
      on-profile: development

management:
  tracing:
    sampling:
      probability: 0.3 # Más sampling en desarrollo

logging:
  level:
    com.example.query_service: DEBUG
    io.opentelemetry: DEBUG
    org.springframework.kafka: INFO

---
# ✅ Production Profile
spring:
  config:
    activate:
      on-profile: production

management:
  tracing:
    sampling:
      probability: 0.05 # Menos sampling en producción
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"

logging:
  level:
    root: WARN
    com.example.query_service: INFO
    io.opentelemetry: ERROR
    org.springframework.kafka: ERROR
    org.mongodb.driver: ERROR