events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with better format
    #log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    #               '$status $body_bytes_sent "$http_referer" '
    #               '"$http_user_agent" "$http_x_forwarded_for" '
    #               'rt=$request_time uct="$upstream_connect_time" '
    #               'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"trace_id":"$http_x_trace_id",'
        '"span_id":"$http_x_span_id",'
        '"service":"frontend-nginx",'
        '"environment":"development"'
    '}';

    #access_log /var/log/nginx/access.log main;
    #error_log /var/log/nginx/error.log;

    access_log /var/log/nginx/access.json json_combined;
    error_log /var/log/nginx/error.json warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # ========================================
        # PROXY PARA API (Kong Gateway)
        # ========================================
        location /api/ {
            # 🔄 Proxy directo a Kong (tu idea original)
            proxy_pass http://kong:8000;
            proxy_http_version 1.1;

            # Headers esenciales para proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ✅ NUEVO: Headers para tracing
            proxy_set_header X-Trace-Id $http_x_trace_id;
            proxy_set_header X-Span-Id $http_x_span_id;

            # Para WebSockets y conexiones persistentes
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Timeouts optimizados
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffer settings para mejor performance
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Retry en caso de falla
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            # ✅ NO HAY HEADERS CORS - No se necesitan!
            # El browser ve todo como mismo origen (localhost:4200)
        }

        # ========================================
        # ANGULAR SPA ROUTING
        # ========================================
        location / {
            # 🎯 SPA routing (tu idea original)
            try_files $uri $uri/ /index.html;

            # Security headers (estos SÍ son necesarios)
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ========================================
        # STATIC ASSETS OPTIMIZATION
        # ========================================
        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;

            # Compresión estática si existe
            gzip_static on;
        }

        # Don't cache HTML files (importante para SPA)
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma no-cache;
            add_header Expires 0 always;
        }

        # ========================================
        # HEALTH CHECKS Y MONITORING
        # ========================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /nginx-status {
            stub_status on;
            access_log off;
            # Solo permitir desde redes internas
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ========================================
        # ERROR HANDLING
        # ========================================
        # Para SPA, todos los errores 404 van a index.html
        error_page 404 /index.html;

        # Errores del server
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # Security: ocultar versión de nginx
        server_tokens off;
    }
}
