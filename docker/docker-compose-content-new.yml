version: "3.9"

services:

# ============================================
# FASE 4: CONTENT MANAGEMENT - ALFRESCO STACK COMPLETO
# ============================================
  alfresco-postgres:
    image: postgres:16.5  # 🔧 CAMBIO: Actualizada a versión oficial más reciente
    container_name: alfresco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco123
    command: postgres -c max_connections=300 -c log_min_messages=LOG  # 🔧 CAMBIO: Optimización oficial
    volumes:
      - alfresco-postgres-data:/var/lib/postgresql/data
      - ./logs/alfresco/postgres:/var/log/postgresql
    networks:
      - content
      - backend
    ports:
      - "5434:5432"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfresco -d alfresco"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  alfresco-activemq:
    image: alfresco/alfresco-activemq:5.18-jre17-rockylinux8  # 🔧 CAMBIO: Versión oficial actualizada
    container_name: alfresco-activemq
    restart: unless-stopped
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - activemq-data:/opt/activemq/data
      - ./logs/alfresco/activemq:/opt/activemq/data/kahadb.log
    networks:
      - content
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    environment:
      ACTIVEMQ_USER: ${ACTIVEMQ_USER:-admin}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "/opt/activemq/bin/activemq", "query", "--objname", "type=Broker,brokerName=*,service=Health", "|", "grep", "Good"]  # 🔧 CAMBIO: Healthcheck oficial
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      retries: ${HEALTHCHECK_RETRIES:-5}
      start_period: ${HEALTHCHECK_START_PERIOD:-60s}

  alfresco-shared-file-store:
    image: alfresco/alfresco-shared-file-store:latest
    container_name: alfresco-shared-file-store
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
      scheduler.content.age.millis: 86400000
      scheduler.cleanup.interval: 86400000
    volumes:
      - shared-file-store-data:/tmp/Alfresco/sfs
      - ./logs/alfresco/sfs:/opt/alfresco-shared-file-store/logs
    networks:
      - content
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "(curl -fsS http://localhost:8099/ready || curl -fsS http://localhost:8099/actuator/health) >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  alfresco-transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.2.1  # 🔧 CAMBIO: Versión oficial actualizada
    container_name: alfresco-transform-core-aio
    restart: unless-stopped
    ports:
      - "8091:8090"
    environment:
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
      ACTIVEMQ_URL: nio://alfresco-activemq:61616
      SHARED_FILE_STORE_URL: http://alfresco-shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file
    volumes:
      - ./logs/alfresco/transform:/opt/alfresco-transform-core-aio/logs
    networks:
      - content
      - backend
    depends_on:
      alfresco-activemq:
        condition: service_healthy
      alfresco-shared-file-store:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  alfresco-solr:
    image: alfresco/alfresco-search-services:2.0.16  # 🔧 CAMBIO: Versión oficial actualizada
    container_name: alfresco-solr
    restart: unless-stopped
    ports:
      - "8983:8983"
    environment:
      SOLR_ALFRESCO_HOST: alfresco-repository
      SOLR_ALFRESCO_PORT: 8080
      SOLR_SOLR_HOST: alfresco-solr
      SOLR_SOLR_PORT: 8983
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco,archive
      SOLR_JAVA_MEM: "-Xms2g -Xmx2g"
      SOLR_OPTS: "-Dsolr.jetty.request.header.size=1000000 -Dsolr.jetty.threads.min=10 -Dsolr.jetty.threads.max=10000 -Dsolr.jetty.threads.idle.timeout=5000"
      JAVA_TOOL_OPTIONS: "-Dalfresco.secureComms=secret -Dalfresco.secureComms.secret=secret"
    volumes:
      - solr-data:/opt/alfresco-search-services/data
      - ./logs/alfresco/solr:/opt/alfresco-search-services/logs
    networks:
      - content
      - backend
    depends_on:
      alfresco-repository:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-Alfresco-Search-Secret: secret' 'http://localhost:8983/solr/alfresco/admin/ping?wt=json' | grep -q '\"status\":\"OK\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  alfresco-repository:
    image: alfresco/alfresco-content-repository-community:25.2.0  # 🔧 CAMBIO: Versión oficial sin sufijo
    container_name: alfresco-repository
    restart: unless-stopped
    # 🔧 CAMBIO: Puertos solo para debugging - comentados para producción
    ports:
      - "8072:8080"  # Acceso directo solo para desarrollo/debug
    command: >
      bash -lc "mkdir -p /usr/local/tomcat/alf_data/keystore &&
                chmod 777 /usr/local/tomcat/alf_data/keystore &&
                exec catalina.sh run"
    environment:
      # 🔧 CAMBIO: Configuración de cifrado oficial agregada
      JAVA_TOOL_OPTIONS: >-
        -Dencryption.keystore.type=JCEKS
        -Dencryption.cipherAlgorithm=DESede/CBC/PKCS5Padding
        -Dencryption.keyAlgorithm=DESede
        -Dencryption.keystore.location=/usr/local/tomcat/shared/classes/alfresco/extension/keystore/keystore
        -Dmetadata-keystore.password=mp6yc0UD9e
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.metadata.password=oKIWzVdEdA
        -Dmetadata-keystore.metadata.algorithm=DESede
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco123
        -Ddb.url=jdbc:postgresql://alfresco-postgres:5432/alfresco
        -Dsolr.host=alfresco-solr
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=localhost
        -Dshare.port=80
        -Dshare.context=share
        -Dalfresco.host=localhost
        -Dalfresco.port=80
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
        -Daos.baseUrlOverwrite=http://localhost/alfresco/aos
        -Dmessaging.broker.url='failover:(nio://alfresco-activemq:61616)?timeout=3000&jms.useCompression=true'
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://alfresco-transform-core-aio:8090/
        -Dcsrf.filter.enabled=false
        -Dcors.enabled=true
        -Dcors.allowed.origins=http://localhost
        -Dcors.allowed.methods=GET,POST,HEAD,OPTIONS,PUT,DELETE
        -Dcors.allowed.headers=Authorization,Content-Type,Cache-Control,X-Requested-With,accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers,X-CSRF-Token
        -Dcors.support.credentials=true
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Ddir.root=/usr/local/tomcat/alf_data
        -Dencryption.keystore.type=pkcs12
        -Dencryption.keystore.location=/usr/local/tomcat/alf_data/keystore/keystore
        -Dmetadata-keystore.aliases=metadata
        -Dmetadata-keystore.password=${ALFRESCO_KEYSTORE_PASS:-alfresco123}
        -Dmetadata-keystore.metadata.password=${ALFRESCO_METADATA_PASS:-alfresco123}
        -Dmetadata-keystore.metadata.algorithm=DESede
        -Dauthentication.chain=alfrescoNtlm:alfrescoNtlm
        -Duser.name.caseSensitive=false
        -Duser.username.caseSensitive=false
        -Dalfresco.authentication.caseSensitive=false
        -Dcache.node.nodesSharedCache.cluster.type=local
    volumes:
      - alfresco-data:/usr/local/tomcat/alf_data
      - ./logs/alfresco/repo:/usr/local/tomcat/logs
      - ./tomcat/localhost:/usr/local/tomcat/conf/Catalina/localhost
    networks:
      - content
      - backend
      - frontend  # 🔧 CAMBIO: Agregada red frontend para acceso desde Nginx
    depends_on:
      alfresco-postgres:
        condition: service_healthy
      alfresco-activemq:
        condition: service_healthy
      alfresco-transform-core-aio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g  # 🔧 CAMBIO: Reducido de 4g a 2g para ser más realista
        reservations:
          cpus: '1'
          memory: 1g  # 🔧 CAMBIO: Reducido de 2g a 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  alfresco-share:
    image: alfresco/alfresco-share:25.2.0  # 🔧 CAMBIO: Versión actualizada para compatibilidad
    container_name: alfresco-share
    restart: unless-stopped
    # 🔧 CAMBIO: Puertos solo para debugging - comentados para producción
    ports:
      - "8073:8080"
    environment:
      REPO_HOST: alfresco-repository  # 🔧 CAMBIO: Comunicación interna directa
      REPO_PORT: 8080                 # 🔧 CAMBIO: Puerto interno del contenedor
      CSRF_FILTER_ORIGIN: http://localhost  # 🔧 CAMBIO: Configuración CSRF oficial
      CSRF_FILTER_REFERER: http://localhost/share/.*  # 🔧 CAMBIO: Configuración CSRF oficial
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=localhost
        -Dalfresco.port=80
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
        -Dshare.host=localhost
        -Dshare.port=80
        -Dshare.context=share
        -Dshare.protocol=http
    volumes:
      - ./logs/alfresco/share:/usr/local/tomcat/logs
    networks:
      - content
      - frontend  # 🔧 CAMBIO: Agregada red frontend para acceso desde Nginx
    depends_on:
      alfresco-repository:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g  # 🔧 CAMBIO: Reducido de 2g a 1g para ser más realista
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share"]  # 🔧 CAMBIO: URL corregida
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  alfresco-content-app:
    image: alfresco/alfresco-content-app:7.1.0  # 🔧 CAMBIO: Versión oficial actualizada
    container_name: alfresco-content-app
    restart: unless-stopped
    # 🔧 CAMBIO: Puertos solo para debugging - comentados para producción
    ports:
      - "4201:8080"
    environment:
      APP_CONFIG_PROVIDER: ECM
      APP_CONFIG_AUTH_TYPE: BASIC
      APP_CONFIG_WITH_CREDENTIALS: "true"
      APP_CONFIG_ECM_HOST: http://localhost  # 🔧 CAMBIO: Vía proxy Nginx
      APP_CONFIG_ECM_CONTEXT_ROOT: alfresco
      APP_CONFIG_LANGUAGE: es
      APP_CONFIG_LOG_LEVEL: ERROR
      APP_BASE_SHARE_URL: "http://localhost/content/#/preview/s"  # 🔧 CAMBIO: URL oficial para previews
    volumes:
      - ./logs/alfresco/content-app:/var/log/nginx
      - ./alfresco/assets/app.config.json:/usr/share/nginx/html/app.config.json:ro
      - ./alfresco/assets/app.config.json:/usr/share/nginx/html/assets/app.config.json:ro
    networks:
      - content
      - frontend  # 🔧 CAMBIO: Agregada red frontend para acceso desde Nginx
    depends_on:
      alfresco-repository:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'  # 🔧 CAMBIO: Valor fijo en lugar de variable
          memory: 128m  # 🔧 CAMBIO: Valor fijo en lugar de variable, igual al oficial
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

# ============================================
# NETWORKS
# ============================================

networks:
  content:
    driver: bridge
    name: content_network
    external: true
  backend:
    driver: bridge
    name: backend_network
    external: true
  frontend:
    driver: bridge
    name: frontend_network
    external: true

# ============================================
# VOLUMES
# ============================================

volumes:
  alfresco-postgres-data:
    name: alfresco_postgres_data
    external: true
  alfresco-data:
    name: alfresco_data
    external: true
  activemq-data:
    name: activemq_data
    external: true
  shared-file-store-data:
    name: shared_file_store_data
    external: true
  solr-data:
    name: solr_data
    external: true
