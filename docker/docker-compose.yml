version: "3.9"

services:

# ============================================
# FASE 0: ADMINISTRADOR DE CONTENEDOR
# ============================================
  portainer:
    #image: portainer/portainer-ce:latest
    image: portainer/portainer-ce:2.31.2-alpine
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - management
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: ${MEMORY_LIMIT_SMALL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/status"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

# ============================================
# FASE 1: INFRAESTRUCTURA BASE (BASES DE DATOS)
# ============================================

  postgres:
    image: debezium/postgres:15
    container_name: postgres
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/postgres:/backups
      - ./logs/postgres:/var/log/postgresql
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: |
      postgres -c max_connections=200
               -c shared_buffers=256MB
               -c effective_cache_size=1GB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c log_destination=stderr
               -c logging_collector=on
               -c log_directory=/var/log/postgresql
               -c log_filename=postgresql-%Y-%m-%d_%H%M%S.log

  postgres-backup:
    image: postgres:15
    container_name: postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups/postgres:/backup
    networks:
      - backend
    command: |
      bash -c "
      if [ '${BACKUP_ENABLED}' = 'true' ]; then
        while true; do
          echo 'Starting PostgreSQL backup...'
          pg_dump -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} > /backup/backup_$$(date +%Y%m%d_%H%M%S).sql
          echo 'Backup completed. Cleaning old backups...'
          find /backup -name '*.sql' -mtime +${BACKUP_RETENTION_DAYS} -delete
          sleep 86400
        done
      else
        echo 'Backup disabled. Exiting...'
        exit 0
      fi"

  mongo:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./backups/mongo:/backup
      - ./logs/mongodb:/var/log/mongodb
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: mongod --logpath /var/log/mongodb/mongod.log --logappend

  kong-db:
    image: postgres:15
    container_name: kong-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KONG_DB_USER}
      POSTGRES_DB: ${KONG_DB_NAME}
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD}
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - gateway
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_DB_USER} -d ${KONG_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ============================================
# FASE 2: COORDINACIÓN Y MENSAJERÍA
# ============================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
      - ./logs/zookeeper:/var/log/zookeeper
    networks:
      - messaging
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kong-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"   # para conexión desde local (host)
      - "29092:29092" # para conexión desde otros contenedores
      - "9999:9999"   # JMX port
#      - "9998:9998"   # RMI registry port (separado)
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_LOG_DIRS: /var/log/kafka
      # ✅ AÑADIR: Configuración JMX
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
#      JMX_PORT: 9999
#      KAFKA_JMX_OPTS: "-Djava.rmi.server.hostname=kafka"
#      KAFKA_OPTS: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Djava.rmi.server.hostname=kafka -Djava.net.preferIPv4Stack=true"
      KAFKA_OPTS: >-
        -Dcom.sun.management.jmxremote=true
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Djava.rmi.server.hostname=kafka
        -Djava.net.preferIPv4Stack=true
#      KAFKA_JMX_OPTS: >-
#        -Dcom.sun.management.jmxremote=true
#        -Dcom.sun.management.jmxremote.authenticate=false
#        -Dcom.sun.management.jmxremote.ssl=false
#        -Dcom.sun.management.jmxremote.local.only=false
#        -Dcom.sun.management.jmxremote.port=9999
#        -Dcom.sun.management.jmxremote.rmi.port=9998
#        -Djava.rmi.server.hostname=kafka
#        -Djava.net.preferIPv4Stack=true
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./logs/kafka:/var/log/kafka
    networks:
      - messaging
      - backend
      - observability
    depends_on:
      zookeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_XLARGE}'
          memory: ${MEMORY_LIMIT_XLARGE}
        reservations:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

# ============================================
# BITNAMI JMX EXPORTER 1.3
# ============================================
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:1.3.0  # ✅ Versión específica que sugeriste
    container_name: kafka-jmx-exporter
    ports:
#      - "8084:8080"  # ✅ Puerto para métricas Prometheus
#      - "8084:5556"
      - "9309:5556"
    environment:
      # ✅ Configuración específica de Bitnami
      JMX_EXPORTER_CONFIG_FILE: /opt/bitnami/jmx-exporter/conf/config.yml
      JMX_EXPORTER_JMX_URL: service:jmx:rmi:///jndi/rmi://kafka:9999/jmxrmi
#      JMX_EXPORTER_PORT: 8080
      # Agregar debug
      JMX_EXPORTER_LOG_LEVEL: DEBUG
    volumes:
      - ./monitoring/kafka-jmx-bitnami.yml:/opt/bitnami/jmx-exporter/conf/config.yml:ro
    networks:
      - observability
      - messaging
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256m
#    healthcheck:
#      test: ["CMD-SHELL", "curl -f http://localhost:5556/metrics || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 45s

# ===== KAFKA EXPORTER - MÉTRICAS DE NEGOCIO ⭐ =====
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'      # ✅ Conexión directa Kafka API
      - '--web.listen-address=:9308'
      - '--log.level=info'
      - '--topic.filter=.*'               # Todos los topics
      - '--group.filter=.*'               # Todos los consumer groups
      - '--sarama.max-version=2.6.0'      # Compatibilidad
    networks:
      - observability
      - messaging
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_config
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONNECT_PLUGIN_PATH: /kafka/connect
      LOG_LEVEL: INFO
    networks:
      - messaging
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# FASE 3: OBSERVABILIDAD CORE
# ============================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    user: "0"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
      - '--storage.tsdb.retention.size=10GB'
    networks:
      - observability
      - backend
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    ports:
      - "9100:9100"
    user: "65534:65534"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netdev.device-exclude=^(veth|docker|br-).*'
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: '${MEMORY_LIMIT_XSMALL}'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
#    command:
#      - '--housekeeping_interval=60s'
#      - '--max_housekeeping_interval=120s'
#      - '--event_storage_event_limit=default=0'
#      - '--event_storage_age_limit=default=0'
#      - '--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,accelerator,hugetlb,referenced_memory,cpu_topology,resctrl'
#      - '--docker_only=false'
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
#    deploy:
#      resources:
#        limits:
#          cpus: '${CPU_LIMIT_MEDIUM}'
#          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    user: "65534:65534"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--web.listen-address=:9115'
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    user: "0"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/var/lib/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/var/lib/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--web.route-prefix=/'
      - '--cluster.listen-address='
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "4317:4317"
      - "16686:16686" # UI web
      - "14250:14250" # receptor gRPC desde el Collector
      - "14269:14269"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=50000
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./logs/otel-collector:/var/log/otel
    ports:
      - "4318:4318" # OTLP HTTP
      - "55681:55681" # OTLP gRPC (opcional)
      - "9464:9464"        # Prometheus scrape endpoint
    networks:
      - observability
      - backend
    depends_on:
      jaeger:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}

# ============================================
# FASE 4A: LOGGING STACK - LOKI
# ============================================

  loki:
    image: grafana/loki:2.9.15
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/var/lib/loki
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  promtail:
    image: grafana/promtail:2.9.15
    container_name: promtail
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/promtail.yaml:ro
      - ./logs:/app/logs:ro
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: 256m

# ============================================
# FASE 4B: LOGGING STACK - ELK
# ============================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
#      - indices.lifecycle.rollover.max_size=1gb
#      - indices.lifecycle.rollover.max_age=${ELASTICSEARCH_RETENTION}
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_XLARGE}'
          memory: ${MEMORY_LIMIT_XLARGE}
        reservations:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

# Añadir Elasticsearch Exporter
  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: elasticsearch-exporter
    ports:
      - "9114:9114"
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.timeout=30s'
      - '--es.all'                          # ✅ Stats de todos los nodos
      - '--es.indices'                      # ✅ Stats de índices
      - '--es.shards'                       # ✅ Stats de shards
      - '--es.indices_settings'             # ✅ Settings de índices
      - '--es.aliases'                      # ✅ Métricas de aliases
      - '--collector.snapshots'             # ✅ Collector de snapshots (correcto)
      - '--collector.clustersettings'       # ✅ Collector de cluster settings
      - '--collector.slm'                   # ✅ Snapshot Lifecycle Management
      - '--web.listen-address=:9114'
      - '--web.telemetry-path=/metrics'
      - '--log.level=info'
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.18.2
    container_name: logstash
    ports:
      - "5044:5044"
      - "9600:9600"  # API endpoint
    volumes:
      - ./logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      # ✅ AÑADIR configuración para habilitar métricas
      - ./logging/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/_node/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    # Habilitar endpoint de métricas
    #  - MONITORING_ENABLED: true
      - MONITORING_ENABLED=true  # ✅ Sin dos puntos
    # Configuración adicional para métricas
    #  - KIBANA_SYSTEM_USERNAME: elastic
    #  - KIBANA_SYSTEM_PASSWORD: ${ELASTIC_PASSWORD}
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_XLARGE}'
          memory: ${MEMORY_LIMIT_XLARGE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  filebeat:
    build:
      context: ./filebeat
    container_name: filebeat
    user: root
    volumes:
      - ./logs:/app/logs:ro
    networks:
      - observability
    depends_on:
      logstash:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: 256m

# ============================================
# FASE 5: VISUALIZACIÓN
# ============================================

  grafana:
    image: grafana/grafana:12.0.2
    #image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ============================================
# FASE 6: API GATEWAY
# ============================================

  kong:
    image: kong:3.6
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      #KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002  # Habilita Kong Manager OSS
      KONG_PLUGINS: bundled,prometheus
    ports:
      - "8000:8000"   # API Gateway público (HTTP)
      - "8443:8443"   # API Gateway público (HTTPS)
      - "8001:8001"   # Admin API (REST)
      - "8444:8444"   # Admin API (HTTPS)
      - "8002:8002"   # Kong Manager (UI gratuita OSS)
    volumes:
      - ./logs/kong:/var/log/kong
    networks:
      - gateway
      - frontend
      - backend
      - observability
    depends_on:
      kong-db:
        condition: service_healthy
      grafana:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# FASE 7: APLICACIONES
# ============================================

  comando-microservicio:
    image: comando-microservicio:latest
    container_name: comando-microservicio
    user: "1001:1001"
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=${JAVA_OPTS_COMMAND}
      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT}
      - LOGGING_LEVEL_COM_EJEMPLO=${LOG_LEVEL_APP}
    volumes:
      - ./logs/command-service:/app/logs/command-service
      - ./logs/frontend:/app/logs/frontend
    networks:
      - backend
      - messaging
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
      kong:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  consulta-microservicio:
    image: consulta-microservicio:latest
    container_name: consulta-microservicio
    user: "1001:1001"
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/${POSTGRES_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=${JAVA_OPTS_QUERY}
      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT}
      - LOGGING_LEVEL_COM_EJEMPLO=${LOG_LEVEL_APP}
    volumes:
      - ./logs/query-service:/app/logs/query-service
    networks:
      - backend
      - messaging
      - observability
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kong:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: frontend:latest
    container_name: frontend
    ports:
      - "4200:80"
    volumes:
      - ./logs/frontend:/var/log/nginx
    networks:
      - frontend
    depends_on:
      kong:
        condition: service_healthy
      comando-microservicio:
        condition: service_healthy
      consulta-microservicio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 20s
      timeout: 5s
      retries: 3

# ============================================
# FASE 8: UTILIDADES
# ============================================

  kafdrop:
    image: obsidiandynamics/kafdrop:4.1.0
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKER_CONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    networks:
      - messaging
      - frontend
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: '${MEMORY_LIMIT_XSMALL}'

# ============================================
# REDES SEGMENTADAS
# ============================================

networks:
  frontend:
    driver: bridge
    name: frontend_network
  backend:
    driver: bridge
    name: backend_network
  messaging:
    driver: bridge
    name: messaging_network
  gateway:
    driver: bridge
    name: gateway_network
  observability:
    driver: bridge
    name: observability_network
  management:
    driver: bridge
    name: management_network

# ============================================
# VOLÚMENES PERSISTENTES
# ============================================

volumes:
  pgdata:
    name: postgres_data
  mongodata:
    name: mongo_data
  kafka_data:
    name: kafka_data
  zookeeper_data:
    name: zookeeper_data
  zookeeper_logs:
    name: zookeeper_logs
  kong-db-data:
    name: kong_db_data
  portainer_data:
    name: portainer_data
  prometheus-data:
    name: prometheus_data
  alertmanager-data:
    name: alertmanager_data
  grafana-storage:
    name: grafana_storage
  loki-data:
    name: loki_data
  esdata:
    name: elasticsearch_data
