apiVersion: 1

datasources:
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    editable: true
    database: "logs-*"
    jsonData:
      interval: Daily
      timeField: "@timestamp"
      esVersion: "8.18.2"
      maxConcurrentShardRequests: 5
    uid: elasticsearch