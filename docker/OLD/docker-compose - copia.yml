version: "3.9"

services:

# ============================================
# FASE 0: ADMINISTRADOR DE CONTENEDOR (PORTAINER)
# ============================================
  portainer:
    image: portainer/portainer-ce:2.31.2-alpine
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - management
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3

# ============================================
# SERVICIO DUMMY PARA ESPERA DE PORTAINER
# ============================================
  wait-portainer:
    image: busybox
    container_name: wait-portainer
    command: sleep 120
    depends_on:
      - portainer
    networks:
      - management
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 16m
    # Este servicio dummy espera 2 minutos tras el arranque de Portainer.
    # Todos los demás servicios deben depender de este servicio para retrasar su inicio.

# ============================================
# FASE 0.5: EDGE LAYER - NGINX PROXY
# ============================================
  nginx-edge:
    image: nginx:1.29.0-alpine
    container_name: nginx-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx-edge:/var/log/nginx
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx_status"]
      interval: 15s
      timeout: 5s
      retries: 3

# ============================================
# FASE 1: INFRAESTRUCTURA BASE (BASES DE DATOS)
# ============================================

  postgres:
    image: debezium/postgres:15
    container_name: postgres
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/postgres:/backups
      - ./logs/postgres:/var/log/postgresql
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: |
      postgres -c max_connections=200
               -c shared_buffers=256MB
               -c effective_cache_size=1GB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c log_destination=stderr
               -c logging_collector=on
               -c log_directory=/var/log/postgresql
               -c log_filename=postgresql-%Y-%m-%d_%H%M%S.log

# ============================================
# FASE 1.5: IDENTITY LAYER - KEYCLOAK
# ============================================
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
      - ./logs/keycloak/db:/var/log/postgresql
    networks:
      - backend
    ports:
      - "5438:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    image: bitnami/keycloak:26.2.5
    container_name: keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      KEYCLOAK_DATABASE_HOST: keycloak-db
      KEYCLOAK_DATABASE_PORT: 5432
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: keycloak
      KEYCLOAK_DATABASE_PASSWORD: keycloak123
      # Admin Configuration
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      # Server Configuration
      KEYCLOAK_HTTP_ENABLED: true
      KEYCLOAK_HOSTNAME_STRICT: false
      KEYCLOAK_PROXY: edge
      KEYCLOAK_ENABLE_STATISTICS: true
      # Performance
      KEYCLOAK_CACHE_STACK: tcp
      KEYCLOAK_LOG_LEVEL: INFO
    volumes:
      - ./logs/keycloak/app:/opt/bitnami/keycloak/logs
    networks:
      - backend
    depends_on:
      keycloak-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres-backup:
    image: postgres:15
    container_name: postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups/postgres:/backup
    networks:
      - backend
    command: |
      bash -c "
      if [ '${BACKUP_ENABLED}' = 'true' ]; then
        while true; do
          echo 'Starting PostgreSQL backup...'
          pg_dump -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} > /backup/backup_$$(date +%Y%m%d_%H%M%S).sql
          echo 'Backup completed. Cleaning old backups...'
          find /backup -name '*.sql' -mtime +${BACKUP_RETENTION_DAYS} -delete
          sleep 86400
        done
      else
        echo 'Backup disabled. Exiting...'
        exit 0
      fi"

  mongo:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./backups/mongo:/backup
      - ./logs/mongodb:/var/log/mongodb
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: mongod --logpath /var/log/mongodb/mongod.log --logappend

  kong-db:
    image: postgres:15
    container_name: kong-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KONG_DB_USER}
      POSTGRES_DB: ${KONG_DB_NAME}
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD}
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - gateway
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KONG_DB_USER} -d ${KONG_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ============================================
# FASE 2: COORDINACIÓN Y MENSAJERÍA
# ============================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
      - ./logs/zookeeper:/var/log/zookeeper
    networks:
      - messaging
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kong-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"   # para conexión desde local (host)
      - "29092:29092" # para conexión desde otros contenedores
      - "9999:9999"   # JMX port
#      - "9998:9998"   # RMI registry port (separado)
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_LOG_DIRS: /var/log/kafka
      # ✅ AÑADIR: Configuración JMX
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
#      JMX_PORT: 9999
#      KAFKA_JMX_OPTS: "-Djava.rmi.server.hostname=kafka"
#      KAFKA_OPTS: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.rmi.port=9999 -Djava.rmi.server.hostname=kafka -Djava.net.preferIPv4Stack=true"
      KAFKA_OPTS: >-
        -Dcom.sun.management.jmxremote=true
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Dcom.sun.management.jmxremote.local.only=false
        -Dcom.sun.management.jmxremote.rmi.port=9999
        -Djava.rmi.server.hostname=kafka
        -Djava.net.preferIPv4Stack=true
#      KAFKA_JMX_OPTS: >-
#        -Dcom.sun.management.jmxremote=true
#        -Dcom.sun.management.jmxremote.authenticate=false
#        -Dcom.sun.management.jmxremote.ssl=false
#        -Dcom.sun.management.jmxremote.local.only=false
#        -Dcom.sun.management.jmxremote.port=9999
#        -Dcom.sun.management.jmxremote.rmi.port=9998
#        -Djava.rmi.server.hostname=kafka
#        -Djava.net.preferIPv4Stack=true
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./logs/kafka:/var/log/kafka
    networks:
      - messaging
      - backend
      - observability
    depends_on:
      zookeeper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_XLARGE}'
          memory: ${MEMORY_LIMIT_XLARGE}
        reservations:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

# ============================================
# BITNAMI JMX EXPORTER 1.3
# ============================================
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:1.3.0  # ✅ Versión específica que sugeriste
    container_name: kafka-jmx-exporter
    ports:
#      - "8084:8080"  # ✅ Puerto para métricas Prometheus
#      - "8084:5556"
      - "9309:5556"
    environment:
      # ✅ Configuración específica de Bitnami
      JMX_EXPORTER_CONFIG_FILE: /opt/bitnami/jmx-exporter/conf/config.yml
      JMX_EXPORTER_JMX_URL: service:jmx:rmi:///jndi/rmi://kafka:9999/jmxrmi
#      JMX_EXPORTER_PORT: 8080
      # Agregar debug
      JMX_EXPORTER_LOG_LEVEL: DEBUG
    volumes:
      - ./monitoring/kafka-jmx-bitnami.yml:/opt/bitnami/jmx-exporter/conf/config.yml:ro
    networks:
      - observability
      - messaging
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256m
#    healthcheck:
#      test: ["CMD-SHELL", "curl -f http://localhost:5556/metrics || exit 1"]
#      interval: 30s
#      timeout: 10s
#      retries: 3
#      start_period: 45s

# ===== KAFKA EXPORTER - MÉTRICAS DE NEGOCIO ⭐ =====
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'      # ✅ Conexión directa Kafka API
      - '--web.listen-address=:9308'
      - '--log.level=info'
      - '--topic.filter=.*'               # Todos los topics
      - '--group.filter=.*'               # Todos los consumer groups
      - '--sarama.max-version=2.6.0'      # Compatibilidad
    networks:
      - observability
      - messaging
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_config
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONNECT_PLUGIN_PATH: /kafka/connect
      LOG_LEVEL: INFO
    networks:
      - messaging
      - backend
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# FASE 3: OBSERVABILIDAD CORE
# ============================================

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    user: "0"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}'
      - '--storage.tsdb.retention.size=10GB'
    networks:
      - observability
      - backend
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    ports:
      - "9100:9100"
    user: "65534:65534"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netdev.device-exclude=^(veth|docker|br-).*'
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: '${MEMORY_LIMIT_XSMALL}'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
#    command:
#      - '--housekeeping_interval=60s'
#      - '--max_housekeeping_interval=120s'
#      - '--event_storage_event_limit=default=0'
#      - '--event_storage_age_limit=default=0'
#      - '--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,accelerator,hugetlb,referenced_memory,cpu_topology,resctrl'
#      - '--docker_only=false'
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
#    deploy:
#      resources:
#        limits:
#          cpus: '${CPU_LIMIT_MEDIUM}'
#          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    user: "65534:65534"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
      - '--web.listen-address=:9115'
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: 128m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    user: "0"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/var/lib/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/var/lib/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--web.route-prefix=/'
      - '--cluster.listen-address='
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "4317:4317"
      - "16686:16686" # UI web
      - "14250:14250" # receptor gRPC desde el Collector
      - "14269:14269"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=50000
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - ./logs/otel-collector:/var/log/otel
    ports:
      - "4318:4318" # OTLP HTTP
      - "55681:55681" # OTLP gRPC (opcional)
      - "9464:9464"        # Prometheus scrape endpoint
    networks:
      - observability
      - backend
    depends_on:
      jaeger:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}

# ============================================
# FASE 4A: LOGGING STACK - LOKI
# ============================================

  loki:
    image: grafana/loki:2.9.15
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/var/lib/loki
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  promtail:
    image: grafana/promtail:2.9.15
    container_name: promtail
    volumes:
      - ./logging/promtail-config.yml:/etc/promtail/promtail.yaml:ro
      - ./logs:/app/logs:ro
    command: -config.file=/etc/promtail/promtail.yaml
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: 256m

# ============================================
# FASE 4B: LOGGING STACK - ELK
# ============================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
#      - indices.lifecycle.rollover.max_size=1gb
#      - indices.lifecycle.rollover.max_age=${ELASTICSEARCH_RETENTION}
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_XLARGE}'
          memory: ${MEMORY_LIMIT_XLARGE}
        reservations:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

# ============================================
# FASE 4.5: CONTENT MANAGEMENT - ALFRESCO STACK
# ============================================
  alfresco-postgres:
    image: postgres:15
    container_name: alfresco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alfresco
      POSTGRES_USER: alfresco
      POSTGRES_PASSWORD: alfresco123
    volumes:
      - alfresco-postgres-data:/var/lib/postgresql/data
      - ./logs/alfresco/postgres:/var/log/postgresql
    networks:
      - backend
    ports:
      - "5434:5432"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfresco -d alfresco"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  alfresco-activemq:
    image: alfresco/alfresco-activemq:5.17-jre17-rockylinux8
    container_name: alfresco-activemq
    restart: unless-stopped
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - activemq-data:/opt/activemq/data
      - ./logs/alfresco/activemq:/opt/activemq/data/kahadb.log
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8161/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  alfresco-shared-file-store:
    image: alfresco/alfresco-shared-file-store:latest
    container_name: alfresco-shared-file-store
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
      scheduler.content.age.millis: 86400000
      scheduler.cleanup.interval: 86400000
    volumes:
      - shared-file-store-data:/tmp/Alfresco/sfs
      - ./logs/alfresco/sfs:/opt/alfresco-shared-file-store/logs
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  alfresco-transform-core-aio:
    image: alfresco/alfresco-transform-core-aio:5.1.7
    container_name: alfresco-transform-core-aio
    restart: unless-stopped
    ports:
      - "8091:8090"
    environment:
      JAVA_OPTS: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=80"
      ACTIVEMQ_URL: nio://alfresco-activemq:61616
      SHARED_FILE_STORE_URL: http://alfresco-shared-file-store:8099/alfresco/api/-default-/private/sfs/versions/1/file
    volumes:
      - ./logs/alfresco/transform:/opt/alfresco-transform-core-aio/logs
    networks:
      - backend
    depends_on:
      alfresco-activemq:
        condition: service_healthy
      alfresco-shared-file-store:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  alfresco-solr:
    image: alfresco/alfresco-search-services:2.0.15
    container_name: alfresco-solr
    restart: unless-stopped
    ports:
      - "8983:8983"
    environment:
      SOLR_ALFRESCO_HOST: alfresco-repository
      SOLR_ALFRESCO_PORT: 8080
      SOLR_SOLR_HOST: alfresco-solr
      SOLR_SOLR_PORT: 8983
      SOLR_CREATE_ALFRESCO_DEFAULTS: alfresco,archive
      SOLR_JAVA_MEM: "-Xms2g -Xmx2g"
      SOLR_OPTS: "-Dsolr.jetty.request.header.size=1000000 -Dsolr.jetty.threads.min=10 -Dsolr.jetty.threads.max=10000 -Dsolr.jetty.threads.idle.timeout=5000"
    volumes:
      - solr-data:/opt/alfresco-search-services/data
      - ./logs/alfresco/solr:/opt/alfresco-search-services/logs
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/cores?action=STATUS"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  alfresco-repository:
    image: alfresco/alfresco-content-repository-community:25.2.0-A.16
    container_name: alfresco-repository
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      # Database
      JAVA_OPTS: >-
        -Ddb.driver=org.postgresql.Driver
        -Ddb.username=alfresco
        -Ddb.password=alfresco123
        -Ddb.url=jdbc:postgresql://alfresco-postgres:5432/alfresco
        -Dsolr.host=alfresco-solr
        -Dsolr.port=8983
        -Dsolr.http.connection.timeout=1000
        -Dsolr.secureComms=secret
        -Dsolr.sharedSecret=secret
        -Dsolr.base.url=/solr
        -Dindex.subsystem.name=solr6
        -Dshare.host=127.0.0.1
        -Dshare.port=8080
        -Dalfresco.host=localhost
        -Dalfresco.port=8082
        -Daos.baseUrlOverwrite=http://localhost:8082/alfresco/aos
        -Dmessaging.broker.url="failover:(nio://alfresco-activemq:61616)?timeout=3000&jms.useCompression=true"
        -Ddeployment.method=DOCKER_COMPOSE
        -DlocalTransform.core-aio.url=http://alfresco-transform-core-aio:8090/
        -Dcsrf.filter.enabled=false
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
    volumes:
      - alfresco-data:/usr/local/tomcat/alf_data
      - ./logs/alfresco/repo:/usr/local/tomcat/logs
    networks:
      - backend
    depends_on:
      alfresco-postgres:
        condition: service_healthy
      alfresco-activemq:
        condition: service_healthy
      alfresco-transform-core-aio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g
        reservations:
          cpus: '1'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/alfresco/api/-default-/public/alfresco/versions/1/probes/-ready-"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  alfresco-share:
    image: alfresco/alfresco-share:23.2.4
    container_name: alfresco-share
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      REPO_HOST: alfresco-repository
      REPO_PORT: 8080
      JAVA_OPTS: >-
        -XX:MinRAMPercentage=50
        -XX:MaxRAMPercentage=80
        -Dalfresco.host=localhost
        -Dalfresco.port=8082
        -Dalfresco.context=alfresco
        -Dalfresco.protocol=http
    volumes:
      - ./logs/alfresco/share:/usr/local/tomcat/logs
    networks:
      - frontend
    depends_on:
      alfresco-repository:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/share/page/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  alfresco-content-app:
    image: alfresco/alfresco-content-app:6.0.0
    container_name: alfresco-content-app
    restart: unless-stopped
    ports:
      - "4201:8080"
    environment:
      APP_CONFIG_PROVIDER: ECM
      APP_CONFIG_AUTH_TYPE: BASIC
      APP_CONFIG_ECM_HOST: http://localhost:8082
    volumes:
      - ./logs/alfresco/content-app:/var/log/nginx
    networks:
      - frontend
    depends_on:
      alfresco-repository:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

# Añadir Elasticsearch Exporter
  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: elasticsearch-exporter
    ports:
      - "9114:9114"
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.timeout=30s'
      - '--es.all'                          # ✅ Stats de todos los nodos
      - '--es.indices'                      # ✅ Stats de índices
      - '--es.shards'                       # ✅ Stats de shards
      - '--es.indices_settings'             # ✅ Settings de índices
      - '--es.aliases'                      # ✅ Métricas de aliases
      - '--collector.snapshots'             # ✅ Collector de snapshots (correcto)
      - '--collector.clustersettings'       # ✅ Collector de cluster settings
      - '--collector.slm'                   # ✅ Snapshot Lifecycle Management
      - '--web.listen-address=:9114'
      - '--web.telemetry-path=/metrics'
      - '--log.level=info'
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.18.2
    container_name: logstash
    ports:
      - "5044:5044"
      - "9600:9600"  # API endpoint
    volumes:
      - ./logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      # ✅ AÑADIR configuración para habilitar métricas
      - ./logging/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/_node/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    # Habilitar endpoint de métricas
    #  - MONITORING_ENABLED: true
      - MONITORING_ENABLED=true  # ✅ Sin dos puntos
    # Configuración adicional para métricas
    #  - KIBANA_SYSTEM_USERNAME: elastic
    #  - KIBANA_SYSTEM_PASSWORD: ${ELASTIC_PASSWORD}
    networks:
      - observability
    depends_on:
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_XLARGE}'
          memory: ${MEMORY_LIMIT_XLARGE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  filebeat:
    build:
      context: ./filebeat
    container_name: filebeat
    user: root
    volumes:
      - ./logs:/app/logs:ro
    networks:
      - observability
    depends_on:
      logstash:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: 256m

# ============================================
# FASE 5: VISUALIZACIÓN
# ============================================

  grafana:
    image: grafana/grafana:12.0.2
    #image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ============================================
# FASE 6: API GATEWAY
# ============================================

  kong:
    image: kong:3.6
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      #KONG_PG_USER: ${KONG_DB_USER}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002  # Habilita Kong Manager OSS
      KONG_PLUGINS: bundled,prometheus
    ports:
      - "8000:8000"   # API Gateway público (HTTP)
      - "8443:8443"   # API Gateway público (HTTPS)
      - "8001:8001"   # Admin API (REST)
      - "8444:8444"   # Admin API (HTTPS)
      - "8002:8002"   # Kong Manager (UI gratuita OSS)
    volumes:
      - ./logs/kong:/var/log/kong
    networks:
      - gateway
      - frontend
      - backend
      - observability
    depends_on:
      kong-db:
        condition: service_healthy
      grafana:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# FASE 6.5: SECURITY STACK - SAST/DAST/IAST
# ============================================
  # SAST - Static Analysis
  sonarqube-db:
    image: postgres:15
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube123
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5435:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:25.6.0.109173-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9002:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube123
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
      # Enhanced Security Configuration
      SONAR_WEB_JAVAOPTS: "-Xmx2g -Xms1g -XX:MaxDirectMemorySize=256m -XX:+HeapDumpOnOutOfMemoryError"
      SONAR_SEARCH_JAVAOPTS: "-Xmx1g -Xms512m -XX:MaxDirectMemorySize=256m -XX:+HeapDumpOnOutOfMemoryError"
      SONAR_CE_JAVAOPTS: "-Xmx1g -Xms512m -XX:MaxDirectMemorySize=256m -XX:+HeapDumpOnOutOfMemoryError"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
      - ./logs/sonarqube:/opt/sonarqube/logs
      # Security plugins and configurations
      - ./security/sonarqube/plugins:/opt/sonarqube/extensions/plugins:ro
      - ./security/sonarqube/conf:/opt/sonarqube/conf:ro
    networks:
      - backend
    depends_on:
      sonarqube-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g
        reservations:
          cpus: '1'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # DAST - Dynamic Analysis
  owasp-zap:
    image: zaproxy/zap-stable:2.16.1
    container_name: owasp-zap
    restart: unless-stopped
    ports:
      - "8092:8080"
      - "8093:8090"
    user: zap
    volumes:
      - zap-data:/zap/wrk
      - ./security/zap:/zap/wrk:rw
      - ./logs/owasp-zap:/zap/wrk/logs
      # Enhanced configuration
      - ./security/zap/policies:/zap/wrk/policies:ro
      - ./security/zap/scripts:/zap/wrk/scripts:ro
    networks:
      - backend
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true -config api.key=zap-api-key-12345
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # IAST - Interactive Analysis
  falco:
    image: falcosecurity/falco-no-driver:0.39.1
    container_name: falco
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /dev:/host/dev
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - ./security/falco:/etc/falco:ro
      - ./logs/falco:/var/log/falco
    networks:
      - backend
    command: falco --userspace
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  # Additional Security Tools
  trivy:
    image: aquasec/trivy:0.52.0
    container_name: trivy
    restart: unless-stopped
    ports:
      - "8094:8080"
    environment:
      - TRIVY_CACHE_DIR=/tmp/trivy
      - TRIVY_QUIET=false
      - TRIVY_NO_PROGRESS=false
      - TRIVY_INSECURE=false
    volumes:
      - trivy-cache:/tmp/trivy
      - ./security/trivy:/reports
      - ./logs/trivy:/var/log/trivy
    networks:
      - backend
    command: server --listen 0.0.0.0:8080
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Security Dashboard
  security-dashboard:
    image: grafana/grafana:12.0.2
    container_name: security-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - security-dashboard-data:/var/lib/grafana
      - ./security/dashboards:/var/lib/grafana/dashboards:ro
      - ./security/provisioning:/etc/grafana/provisioning:ro
    networks:
      - backend
    depends_on:
      - sonarqube
      - owasp-zap
      - falco
      - trivy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# FASE 7: APLICACIONES
# ============================================

  comando-microservicio:
    image: comando-microservicio:latest
    container_name: comando-microservicio
    user: "1001:1001"
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=${JAVA_OPTS_COMMAND}
      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT}
      - LOGGING_LEVEL_COM_EJEMPLO=${LOG_LEVEL_APP}
    volumes:
      - ./logs/command-service:/app/logs/command-service
      - ./logs/frontend:/app/logs/frontend
    networks:
      - backend
      - messaging
      - observability
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
      kong:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  consulta-microservicio:
    image: consulta-microservicio:latest
    container_name: consulta-microservicio
    user: "1001:1001"
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/${POSTGRES_DB}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_OPTS=${JAVA_OPTS_QUERY}
      - LOGGING_LEVEL_ROOT=${LOG_LEVEL_ROOT}
      - LOGGING_LEVEL_COM_EJEMPLO=${LOG_LEVEL_APP}
    volumes:
      - ./logs/query-service:/app/logs/query-service
    networks:
      - backend
      - messaging
      - observability
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kong:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
        reservations:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: frontend:latest
    container_name: frontend
    ports:
      - "4200:80"
    volumes:
      - ./logs/frontend:/var/log/nginx
    networks:
      - frontend
    depends_on:
      kong:
        condition: service_healthy
      comando-microservicio:
        condition: service_healthy
      consulta-microservicio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_MEDIUM}'
          memory: ${MEMORY_LIMIT_MEDIUM}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 20s
      timeout: 5s
      retries: 3

# ============================================
# FASE 8: UTILIDADES
# ============================================

  kafdrop:
    image: obsidiandynamics/kafdrop:4.1.0
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKER_CONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    networks:
      - messaging
      - frontend
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_SMALL}'
          memory: '${MEMORY_LIMIT_XSMALL}'

# ============================================
# FASE 8.5: DATA PLATFORM - NIFI
# ============================================
  nifi-registry:
    image: apache/nifi-registry:2.0.0
    container_name: nifi-registry
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      LOG_LEVEL: INFO
      NIFI_REGISTRY_DB_DIR: /opt/nifi-registry/nifi-registry-current/database
      NIFI_REGISTRY_FLOW_PROVIDER: file
      NIFI_REGISTRY_FLOW_STORAGE_DIR: /opt/nifi-registry/nifi-registry-current/flow_storage
    volumes:
      - nifi-registry-database:/opt/nifi-registry/nifi-registry-current/database
      - nifi-registry-flow-storage:/opt/nifi-registry/nifi-registry-current/flow_storage
      - ./logs/nifi/registry:/opt/nifi-registry/nifi-registry-current/logs
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/nifi-registry/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nifi:
    image: apache/nifi:2.0.0
    container_name: nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8084:8080"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: admin123456789
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_HTTP_HOST: 0.0.0.0
      NIFI_CLUSTER_IS_NODE: false
      NIFI_ELECTION_MAX_WAIT: 30 sec
      NIFI_SENSITIVE_PROPS_KEY: nifi123456789012
    volumes:
      - nifi-database-repository:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile-repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content-repository:/opt/nifi/nifi-current/content_repository
      - nifi-provenance-repository:/opt/nifi/nifi-current/provenance_repository
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-logs:/opt/nifi/nifi-current/logs
      - ./logs/nifi/app:/opt/nifi/nifi-current/logs
    networks:
      - backend
    depends_on:
      nifi-registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8g
        reservations:
          cpus: '1'
          memory: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nifi/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

# ============================================
# FASE 8.6: DATA GOVERNANCE - DATAHUB
# ============================================
  datahub-postgres:
    image: postgres:15
    container_name: datahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: datahub
      POSTGRES_USER: datahub
      POSTGRES_PASSWORD: datahub123
    volumes:
      - datahub-postgres-data:/var/lib/postgresql/data
      - ./logs/datahub/postgres:/var/log/postgresql
    networks:
      - backend
    ports:
      - "5437:5432"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datahub -d datahub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  datahub-elasticsearch:
    image: elasticsearch:8.15.0
    container_name: datahub-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - datahub-esdata:/usr/share/elasticsearch/data
    networks:
      - backend
    ports:
      - "9201:9200"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  datahub-backend:
    image: acryldata/datahub-gms:v0.14.1
    container_name: datahub-backend
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - DATAHUB_GMS_HOST=0.0.0.0
      - DATAHUB_GMS_PORT=8080
      - EBEAN_DATASOURCE_USERNAME=datahub
      - EBEAN_DATASOURCE_PASSWORD=datahub123
      - EBEAN_DATASOURCE_HOST=datahub-postgres:5432
      - EBEAN_DATASOURCE_URL=jdbc:postgresql://datahub-postgres:5432/datahub?verifyServerCertificate=false&useSSL=false&useUnicode=yes&characterEncoding=UTF-8
      - EBEAN_DATASOURCE_DRIVER=org.postgresql.Driver
      - ELASTICSEARCH_HOST=datahub-elasticsearch
      - ELASTICSEARCH_PORT=9200
      - GRAPH_SERVICE_IMPL=elasticsearch
      - ENTITY_REGISTRY_CONFIG_PATH=/datahub/datahub-gms/resources/entity-registry.yml
      - DATAHUB_ANALYTICS_ENABLED=true
    volumes:
      - ./logs/datahub/backend:/datahub/datahub-gms/logs
    networks:
      - backend
    depends_on:
      datahub-postgres:
        condition: service_healthy
      datahub-elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  datahub-frontend:
    image: acryldata/datahub-frontend-react:v0.14.1
    container_name: datahub-frontend
    restart: unless-stopped
    ports:
      - "9003:9002"
    environment:
      - DATAHUB_GMS_HOST=datahub-backend
      - DATAHUB_GMS_PORT=8080
      - DATAHUB_SECRET=datahub123456789012345678901234567890
      - DATAHUB_APP_VERSION=1.0
      - DATAHUB_PLAY_MEM_BUFFER_SIZE=10MB
      - JAVA_OPTS=-Xms512m -Xmx512m -Dhttp.port=9002 -Dconfig.file=datahub-frontend/conf/application.conf -Djava.security.auth.login.config=datahub-frontend/conf/jaas.conf -Dlogback.configurationFile=datahub-frontend/conf/logback.xml -Dlogback.debug=false -Dpidfile.path=/dev/null
      - DATAHUB_ANALYTICS_ENABLED=true
      - ELASTIC_CLIENT_HOST=datahub-elasticsearch
      - ELASTIC_CLIENT_PORT=9200
    volumes:
      - ./logs/datahub/frontend:/datahub/datahub-frontend/logs
    networks:
      - frontend
    depends_on:
      datahub-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# ============================================
# FASE 8.7: WORKFLOW ORCHESTRATION - AIRFLOW
# ============================================
  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
      - ./logs/airflow/postgres:/var/log/postgresql
    networks:
      - backend
    ports:
      - "5436:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  airflow-init:
    image: apache/airflow:2.10.3
    container_name: airflow-init
    environment:
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin123
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_ROLE: Admin
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow123@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
      - airflow-config:/opt/airflow/config
    networks:
      - backend
    depends_on:
      airflow-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  airflow-webserver:
    image: apache/airflow:2.10.3
    container_name: airflow-webserver
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow123@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: airflow123456789012345678901234567890123456789012345
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin123
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
      - airflow-config:/opt/airflow/config
      - ./logs/airflow/webserver:/opt/airflow/logs
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  airflow-scheduler:
    image: apache/airflow:2.10.3
    container_name: airflow-scheduler
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow123@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CORE__FERNET_KEY: airflow123456789012345678901234567890123456789012345
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    volumes:
      - airflow-dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
      - airflow-config:/opt/airflow/config
    networks:
      - backend
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--hostname", "$(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5

