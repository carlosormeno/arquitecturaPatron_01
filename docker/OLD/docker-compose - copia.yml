# ============================================
# FASE 9: CI/CD & DEVSECOPS
# ============================================

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend
      - backend
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5

  argocd:
    image: argoproj/argocd:v2.11.3
    container_name: argocd
    restart: unless-stopped
    ports:
      - "8087:8080"
    command: ["argocd-server", "--insecure"]
    networks:
      - frontend
      - backend
    volumes:
      - ./logs/argocd:/var/log/argocd
      - argocd-data:/data # Persistencia de datos/configuración
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  harbor:
    image: goharbor/harbor-core:v2.10.0
    container_name: harbor
    restart: unless-stopped
    ports:
      - "8089:8080"
      - "4443:4443"
      - "4444:4444"
    environment:
      - CORE_SECRET=harborcoresecret
      - POSTGRESQL_HOST=postgres
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
    networks:
      - backend
    depends_on:
      - postgres
    volumes:
      - harbor-data:/data
      - harbor-log:/var/log/harbor
      - harbor-config:/etc/harbor
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2.0/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  snyk:
    image: snyk/snyk-cli:docker
    container_name: snyk
    restart: unless-stopped
    environment:
      - SNYK_TOKEN=your_snyk_token
    networks:
      - backend
    command: tail -f /dev/null # Espera comandos desde CI/CD
    volumes:
      - ./logs/snyk:/var/log/snyk
      - snyk-data:/data # Persistencia de resultados/configuración
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512m

  qwiet:
    image: quay.io/qwiet/shiftleft:latest
    container_name: qwiet
    restart: unless-stopped
    environment:
      - SHIFTLEFT_TOKEN=your_qwiet_token
    networks:
      - backend
    command: tail -f /dev/null # Espera comandos desde CI/CD
    volumes:
      - ./logs/qwiet:/var/log/qwiet
      - qwiet-data:/data # Persistencia de resultados/configuración
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512m

# ============================================
# NOTA: Trivy ya está integrado como servicio y se usa para escaneo de imágenes en CI/CD
# ============================================

# ============================================
# INTEGRACIÓN SAST/DAST/IAST
# ============================================
# SAST: SonarQube, Snyk, Qwiet
# DAST: OWASP ZAP, Snyk (DAST), Qwiet (DAST)
# IAST: Falco (runtime), Snyk (IAST), Qwiet (IAST)
# Harbor: Registro seguro de imágenes, escaneo automático con Trivy
# Jenkins/ArgoCD: Orquestación de pipelines y despliegue GitOps


# ============================================
# REDES SEGMENTADAS
# ============================================

networks:
  frontend:
    driver: bridge
    name: frontend_network
  backend:
    driver: bridge
    name: backend_network
  messaging:
