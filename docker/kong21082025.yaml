upstreams:
- algorithm: round-robin
  hash_fallback: none
  hash_on: none
  hash_on_cookie_path: /
  healthchecks:
    active:
      concurrency: 2
      healthy:
        http_statuses:
        - 200
        - 302
        interval: 5
        successes: 2
      http_path: /actuator/health
      https_verify_certificate: true
      timeout: 2
      type: http
      unhealthy:
        http_failures: 2
        http_statuses:
        - 429
        - 404
        - 500
        - 501
        - 502
        - 503
        - 504
        - 505
        interval: 5
        tcp_failures: 0
        timeouts: 2
    passive:
      healthy:
        http_statuses:
        - 200
        - 201
        - 202
        - 203
        - 204
        - 205
        - 206
        - 207
        - 208
        - 226
        - 300
        - 301
        - 302
        - 303
        - 304
        - 305
        - 306
        - 307
        - 308
        successes: 1
      type: http
      unhealthy:
        http_failures: 3
        http_statuses:
        - 429
        - 500
        - 503
        tcp_failures: 0
        timeouts: 3
    threshold: 0
  name: comando-upstream
  slots: 10000
  targets:
  - target: comando-microservicio:8081
    weight: 100
  use_srv_name: false
