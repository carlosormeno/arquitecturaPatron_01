receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:

exporters:
  #jaeger:
  otlp/jaeger:
    endpoint: http://jaeger:4317
    #endpoint: "jaeger:14250"
    #endpoint: grpc://jaeger:14250
    tls:
      insecure: true
  #logging:
    #loglevel: debug
  debug:
    verbosity: detailed
  
  prometheus:
    endpoint: "0.0.0.0:9464"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      #exporters: [jaeger, logging]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
