version: "3.9"

# ============================================
# ARCHIVO PRINCIPAL DE ORQUESTACIÓN
# Docker Compose Modular por Fases
# ============================================

# Este archivo principal define solo lo esencial
# Para levantar stacks específicos usar los archivos por fase

services:

# ============================================
# ADMINISTRADOR DE CONTENEDORES
# ============================================
  portainer:
    image: docker.io/portainer/portainer-ce:alpine-sts
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - management
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3

# ============================================
# INICIALIZADOR DE INFRAESTRUCTURA
# Este servicio fuerza la creación de todas las redes y volúmenes
# ============================================
  infrastructure-init:
    image: busybox
    container_name: infrastructure-init
    command: |
      sh -c "
      echo 'Inicializando infraestructura base...'
      echo 'Redes creadas: frontend, backend, messaging, gateway, observability, management'
      echo 'Volúmenes compartidos creados'
      echo 'Bootstrap completado - Infraestructura lista para otros stacks'
      sleep 30
      "
    networks:
      # Core Networks - FUERZA LA CREACIÓN
      - frontend
      - backend
      - messaging
      - gateway
      - observability
      - management
      
      # Specialized Networks - FUERZA LA CREACIÓN
      - security
      - identity
      - content
      - data-platform
      - data-governance
      - workflow
      - business-rules
      - cicd
      - registry
      - apps
    volumes:
      # Fuerza la creación de volúmenes

      # Bases de datos
      - postgres_data:/data/postgres
      - mongo_data:/data/mongo
      - kong_db_data:/data/kong

      # Messaging
      - kafka_data:/messaging/kafka
      - zookeeper_data:/messaging/zookeeper-data
      - zookeeper_logs:/messaging/zookeeper-logs

      # Observabilidad
      - prometheus_data:/observability/prometheus
      - grafana_data:/observability/grafana
      - elasticsearch_data:/observability/elasticsearch
      - alertmanager_data:/observability/alertmanager
      - loki_data:/observability/loki
      - opensearch_data:/observability/opensearch
      - fluentd_data:/observability/fluentd

      # Recursos compartidos
      - shared_logs:/shared/logs
      - shared_config:/shared/config
      - shared_backups:/shared/backups
      - shared_certificates:/shared/certs

      # Identity & Security
      - keycloak_data:/identity/keycloak
      - keycloak_data1:/identity/keycloak1
      - vault_data:/security/vault

      # Content Management
      - alfresco_data:/content/alfresco

      # Data Platform
      - nifi_data:/dataplatform/nifi
      - datahub_data:/dataplatform/datahub

      # Workflow
      - airflow_data:/workflow/airflow

      # CI/CD
      - gitea_data:/cicd/gitea
      - nexus_data:/cicd/nexus
      - harbor_data:/cicd/harbor

            # ========= CONTENT extra =========
      - alfresco_postgres_data:/content/alfresco-postgres
      - activemq_data:/content/alfresco-activemq
      - shared_file_store_data:/content/alfresco-sfs
      - solr_data:/content/alfresco-solr

      # ========= REGISTRY extra =========
      - harbor_db_data:/cicd/harbor-db
      - harbor_redis_data:/cicd/harbor-redis
      - harbor_registry_data:/cicd/harbor-registry
      - postgres_nexus_data:/cicd/nexus-postgres
      - compliance_data:/cicd/compliance

      # ========= WORKFLOW extra =========
      - airflow_postgres_data:/workflow/airflow-postgres
      - airflow_dags:/workflow/airflow-dags
      - airflow_logs:/workflow/airflow-logs
      - airflow_plugins:/workflow/airflow-plugins
      - airflow_config:/workflow/airflow-config
      - redis_data:/workflow/redis

      # ========= SECURITY extra =========
      - sonarqube_db_data:/security/sonarqube-db
      - sonarqube_data:/security/sonarqube-data
      - sonarqube_logs:/security/sonarqube-logs
      - sonarqube_extensions:/security/sonarqube-extensions
      - zap_data:/security/zap
      - trivy_cache:/security/trivy-cache
      - security_dashboard_data:/security/security-dashboard

      # ========= CI/CD nombres con guion =========
      - gitea-data:/cicd/gitea-hyphen
      - jenkins-data:/cicd/jenkins

      # ========= BUSINESS RULES =========
      - gorules_data:/business/gorules

      # ========= DATA PLATFORM (NiFi / Registry) =========
      - nifi_database_repository:/dataplatform/nifi/database_repository
      - nifi_flowfile_repository:/dataplatform/nifi/flowfile_repository
      - nifi_content_repository:/dataplatform/nifi/content_repository
      - nifi_provenance_repository:/dataplatform/nifi/provenance_repository
      - nifi_state:/dataplatform/nifi/state
      - nifi_logs:/dataplatform/nifi/logs
      - nifi_registry_database:/dataplatform/nifi_registry/database
      - nifi_registry_flow_storage:/dataplatform/nifi_registry/flow_storage

      # ========= DATA GOVERNANCE (DataHub) =========
      - datahub_postgres_data:/governance/datahub-postgres
      - datahub_elasticsearch_data:/governance/datahub-elasticsearch

      # ========= AWS S3 =========
      - minio_data:/aws/aws_s3


    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32m
    depends_on:
      - portainer

# ============================================
# REDES DE INFRAESTRUCTURA
# Estas redes serán usadas por todos los otros stacks
# ============================================

networks:
  # ========== CORE NETWORKS ==========
