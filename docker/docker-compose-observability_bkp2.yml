# ============================================
# KAFKA MONITORING
# ============================================

  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:1.3.0
    container_name: kafka-jmx-exporter
    ports:
      - "9309:5556"
    environment:
      JMX_EXPORTER_CONFIG_FILE: /opt/bitnami/jmx-exporter/conf/config.yml
      JMX_EXPORTER_JMX_URL: service:jmx:rmi:///jndi/rmi://kafka:9999/jmxrmi
      JMX_EXPORTER_LOG_LEVEL: DEBUG
    volumes:
      - ./monitoring/kafka-jmx-bitnami.yml:/opt/bitnami/jmx-exporter/conf/config.yml:ro
    networks:
      - observability
      - messaging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256m

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'
      - '--web.listen-address=:9308'
      - '--log.level=info'
      - '--topic.filter=.*'
      - '--group.filter=.*'
      - '--sarama.max-version=2.6.0'
    networks:
      - observability
      - messaging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# VISUALIZATION
# ============================================

  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana
    ports:
      - "3000:3000"
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ============================================
# NETWORKS
# ============================================

networks:
  observability:
    driver: bridge
    name: observability_network
    external: true
  backend:
    driver: bridge
    name: backend_network
    external: true
  messaging:
    driver: bridge
    name: messaging_network
    external: true

# ============================================
# VOLUMES
# ============================================

volumes:
  prometheus_data:
    name: prometheus_data
    external: true
  alertmanager_data:
    name: alertmanager_data
    external: true
  grafana_data:
    name: grafana_data
    external: true
  loki_data:
    name: loki_data
    external: true
  esdata:
    name: elasticsearch_data
    external: true
   # ... volumes existentes ...
  opensearch_data:
    name: opensearch_data
    external: true
  fluentd_data:
    name: fluentd_data
    external: true
