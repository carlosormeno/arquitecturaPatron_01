version: "3.9"

services:

# ============================================
# FASE 2: EDGE LAYER - NGINX PROXY
# ============================================
  nginx-edge:
    image: nginx:1.29.0-alpine
    container_name: nginx-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx-edge:/var/log/nginx
    networks:
      - frontend
      - gateway
    depends_on:
      kong:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4
    command:
      - "--nginx.scrape-uri=http://nginx-edge:8081/nginx_status"
    expose:
      - "9113"
    depends_on:
      - nginx-edge
    networks:
      - observability
      - gateway   # o la red donde esté nginx-edge

# ============================================
# API GATEWAY - KONG
# ============================================

  kong:
    image: kong:3.6
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002  # Habilita Kong Manager OSS
      KONG_PLUGINS: bundled,prometheus
    ports:
      - "8000:8000"   # API Gateway público (HTTP)
      - "8443:8443"   # API Gateway público (HTTPS)
      - "8001:8001"   # Admin API (REST)
      - "8444:8444"   # Admin API (HTTPS)
      - "8002:8002"   # Kong Manager (UI gratuita OSS)
    volumes:
      - ./logs/kong:/var/log/kong
    networks:
      - gateway
      - frontend
      - backend
      - observability
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT_LARGE}'
          memory: ${MEMORY_LIMIT_LARGE}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================
# NETWORKS
# ============================================

networks:
  frontend:
    driver: bridge
    name: frontend_network
    external: true
  backend:
    driver: bridge
    name: backend_network
    external: true
  gateway:
    driver: bridge
    name: gateway_network
    external: true
  observability:
    driver: bridge
    name: observability_network
    external: true
