groups:
  - name: system_alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 80%"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute"

  - name: application_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5..", job=~"command-service|query-service"}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job=~"command-service|query-service"}[5m]))
          > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate in {{ $labels.job }}"
          description: "5xx > 10% for 5m in {{ $labels.job }}"

      - alert: SlowResponseTimeP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job) (rate(http_server_requests_seconds_bucket{job=~"command-service|query-service"}[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 > 1s in {{ $labels.job }}"
          description: "p95 latency > 1s for 5m"

  - name: kafka_alerts_extra
    rules:
      - alert: KafkaConsumerLagHigh
        expr: kafka:consumergroup_lag:sum > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka lag alto ({{ $labels.consumergroup }})"
          description: "Lag > 10k por 10m en consumer group {{ $labels.consumergroup }}."

      - alert: KafkaBrokersZero
        expr: kafka_brokers == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kafka sin brokers"
          description: "kafka_brokers == 0. Broker caído o no alcanzable."

      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_server_replicamanager_underreplicatedpartitions > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka con particiones sub-replicadas"
          description: "Hay particiones bajo replicación. Revisa salud del cluster."

      - alert: KafkaJVMHeapHigh
        expr: |
          (sum by (job) (jvm_memory_bytes_used{area="heap", job="kafka-technical"}))
          /
          (sum by (job) (jvm_memory_bytes_max{area="heap", job="kafka-technical"})) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka JVM heap > 85%"
          description: "Uso de heap alto de forma sostenida en {{ $labels.job }}."

  - name: es_alerts_extra
    rules:
      - alert: ESClusterRed
        expr: es:cluster_health_status == 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Cluster ES/OS en ROJO"
          description: "Health status rojo por >2m."

      - alert: ESDiskLow
        expr: es:fs_free_ratio:min < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Espacio libre bajo en ES/OS (<15%)"
          description: "Espacio libre mínimo por nodo <15% por >10m."

      - alert: ESUnassignedShards
        expr: elasticsearch_cluster_health_unassigned_shards > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Shards sin asignar en ES/OS"
          description: "Existen shards sin asignar >10m. Revisa balanceo y replicas."

  - name: app_alerts_extra
    rules:
      - alert: HighErrorRate5xx
        expr: app:http_error_rate_5xx:rate5m > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "5xx > 10% en {{ $labels.job }}"
          description: "Tasa de errores 5xx alta en {{ $labels.job }}."

      - alert: AppLatencyP95High
        expr: app:http_latency_p95:rate5m > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 > 1s en {{ $labels.job }}"
          description: "Latencia P95 alta en {{ $labels.job }} (5m)."
