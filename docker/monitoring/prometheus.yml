global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"
  - "blackbox-alerts.yml"
  - "recording-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'command-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['comando-microservicio:8081']

  - job_name: 'query-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['consulta-microservicio:8082']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:9464']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']

#  - job_name: 'kafka-jmx'
#    static_configs:
#      - targets: ['kafka-jmx-exporter:8084']
#    scrape_interval: 30s
#    metrics_path: '/metrics'
#    scrape_timeout: 10s

  # ===== KAFKA HYBRID MONITORING =====

  # Kafka Exporter - Métricas de negocio (consumer lag, topics)
  - job_name: 'kafka-business'
    static_configs:
      - targets: ['kafka-exporter:9308']
    scrape_interval: 15s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  # JMX Exporter - Métricas técnicas (JVM, controller, performance)  
  - job_name: 'kafka-technical'
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scrape_timeout: 10s

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

  # ===== LOGGING STACK - LOKI =====
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ===== LOGGING STACK - ELK =====
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch-exporter:9114']
#      - targets: ['elasticsearch:9200']
    metrics_path: '/metrics'
#    scrape_interval: 30s

#  - job_name: 'logstash'
#    static_configs:
#      - targets: ['logstash:9600']
#    metrics_path: '/_node/stats'
#    scrape_interval: 30s

#  - job_name: 'kibana'
#    static_configs:
#      - targets: ['kibana:5601']
#    metrics_path: '/api/status'
#    scrape_interval: 30s

  - job_name: "nginx-edge"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: 'opensearch-direct'
    static_configs:
      - targets: ['opensearch-exporter:9114']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'blackbox-http-apis'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        # Kong Gateway endpoints
        - http://kong:8000/health
        - http://kong:8001/status

        # Servicios de observabilidad
        - http://grafana:3000/api/health
        - http://loki:3100/ready
        - http://prometheus:9090/-/healthy
        - http://alertmanager:9093/-/healthy
        - http://jaeger:16686/
        - http://elasticsearch:9200/_cluster/health
        - http://kibana:5601/api/status
        - http://logstash:9600/_node/stats

        # Kafdrop para Kafka
        - http://kafdrop:9000/actuator/health

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # === MONITOREO DE CONECTIVIDAD TCP ===
  - job_name: 'blackbox-tcp-services'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
        # Bases de datos
        - postgres:5432
        - mongodb:27017
        - redis:6379

        # Kafka & Zookeeper
        - kafka:9092
        - zookeeper:2181

        # Elasticsearch
        - elasticsearch:9200

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # === MONITOREO DE CERTIFICADOS SSL ===
  - job_name: 'blackbox-ssl-check'
    metrics_path: /probe
    params:
      module: [http_ssl_check]
    static_configs:
      - targets:
        - https://kong:8443
        # Agrega aquí tus dominios externos
        - https://google.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # === MONITOREO DE RESPUESTAS ESPECÍFICAS ===
  - job_name: 'blackbox-api-health'
    metrics_path: /probe
    params:
      module: [http_json_response]
    static_configs:
      - targets:
        - http://kong:8000/api/v1/health
        # Agrega aquí tus endpoints de health check
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# === MONITOREO DE COMMAND-SERVICE Y QUERY-SERICE ===
  - job_name: 'blackbox-microservices'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://comando-microservicio:8081/actuator/health
          - http://consulta-microservicio:8082/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
