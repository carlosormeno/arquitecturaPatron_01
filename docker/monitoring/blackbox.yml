# monitoring/blackbox.yml
modules:
  # === MONITOREO HTTP/HTTPS ===
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 201, 202]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      headers:
        User-Agent: "Blackbox-Exporter/1.0"

  # Para APIs que requieren autenticación
  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
      headers:
        Content-Type: application/json
        Authorization: "Bearer tu-token-aqui"
      body: '{"health": "check"}'
      valid_status_codes: [200, 201]

  # Para APIs que esperan respuestas específicas
  http_json_response:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"status":"ok"'
        - '"health":"healthy"'

  # Para verificar certificados SSL
  http_ssl_check:
    prober: http
    timeout: 5s
    http:
      method: GET
      tls_config:
        insecure_skip_verify: false
      preferred_ip_protocol: "ip4"

  # === MONITOREO TCP ===
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"

  # Para bases de datos específicas
  postgres_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"
      query_response:
        - expect: "^\\x00"  # Respuesta inicial de PostgreSQL

  # === MONITOREO DNS ===
  dns_query:
    prober: dns
    timeout: 5s
    dns:
      query_name: "example.com"
      query_type: "A"
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_matches_regexp:
          - ".*127.0.0.1"  # Evitar respuestas de localhost

  # === MONITOREO SMTP ===
  smtp_starttls:
    prober: tcp
    timeout: 5s
    tcp:
      query_response:
        - expect: "^220"
        - send: "EHLO prober"
        - expect: "^250-STARTTLS"
        - send: "STARTTLS"
        - expect: "^220"
        - starttls: true
        - send: "EHLO prober"
        - expect: "^250-AUTH"
        - send: "QUIT"

  # === MONITOREO ICMP (PING) ===
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"
      source_ip_address: "127.0.0.1"

---
# monitoring/prometheus-blackbox.yml
# Configuración específica para Prometheus con Blackbox

global:
  scrape_interval: 15s

scrape_configs:
  # === MONITOREO DE APIs ===
  - job_name: 'blackbox-http-apis'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        # Kong Gateway endpoints
        - http://kong:8000/health
        - http://kong:8001/status
        
        # Servicios de observabilidad
        - http://grafana:3000/api/health
        - http://prometheus:9090/-/healthy
        - http://alertmanager:9093/-/healthy
        - http://jaeger:16686/
        - http://kibana:5601/api/status
        
        # Kafdrop para Kafka
        - http://kafdrop:9000/actuator/health
        
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # === MONITOREO DE CONECTIVIDAD TCP ===
  - job_name: 'blackbox-tcp-services'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
        # Bases de datos
        - postgres:5432
        - mongodb:27017
        - redis:6379
        
        # Kafka & Zookeeper
        - kafka:9092
        - zookeeper:2181
        
        # Elasticsearch
        - elasticsearch:9200
        
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # === MONITOREO DE CERTIFICADOS SSL ===
  - job_name: 'blackbox-ssl-check'
    metrics_path: /probe
    params:
      module: [http_ssl_check]
    static_configs:
      - targets:
        - https://kong:8443
        # Agrega aquí tus dominios externos
        - https://google.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # === MONITOREO DE RESPUESTAS ESPECÍFICAS ===
  - job_name: 'blackbox-api-health'
    metrics_path: /probe
    params:
      module: [http_json_response]
    static_configs:
      - targets:
        - http://kong:8000/api/v1/health
        # Agrega aquí tus endpoints de health check
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# === MONITOREO DE COMMAND-SERVICE Y QUERY-SERICE ===
  - job_name: 'blackbox-microservices'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://comando-microservicio:8081/actuator/health
          - http://consulta-microservicio:8082/actuator/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115


---
# monitoring/blackbox-alerts.yml
# Alertas específicas para Blackbox Exporter

groups:
  - name: blackbox_alerts
    rules:
      # Alerta cuando un servicio no responde
      - alert: ServiceDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "The service at {{ $labels.instance }} has been down for more than 1 minute"

      # Alerta por tiempo de respuesta lento
      - alert: SlowResponse
        expr: probe_duration_seconds > 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow response from {{ $labels.instance }}"
          description: "{{ $labels.instance }} is responding slowly ({{ $value }}s)"

      # Alerta por certificado SSL próximo a expirar
      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 30  # 30 días
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon for {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"

      # Alerta por certificado SSL expirado
      - alert: SSLCertExpired
        expr: probe_ssl_earliest_cert_expiry - time() <= 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SSL certificate expired for {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} has expired"

      # Alerta por código de estado HTTP incorrecto
      - alert: HTTPStatusCode
        expr: probe_http_status_code <= 199 OR probe_http_status_code >= 400
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "HTTP status code error for {{ $labels.instance }}"
          description: "HTTP status code is {{ $value }} for {{ $labels.instance }}"