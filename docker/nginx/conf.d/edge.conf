# Nginx "edge" público + server interno para health/metrics.

# ==============================
# SERVER PÚBLICO (HTTP :80)
# ==============================
server {
  listen 80;
  server_name _;

  # DNS de Docker para resolver servicios por nombre
  resolver 127.0.0.11 valid=30s;

  # Servir SPA (coloca el build en /usr/share/nginx/html)
  root /usr/share/nginx/html;
  index index.html;

  # Seguridad mínima en el borde (puedes sumar CSP/HSTS más adelante)
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-XSS-Protection "1; mode=block";

  # Health para tu healthcheck: wget http://127.0.0.1/health
  location = /health {
    access_log off;
    add_header Cache-Control "no-store";
    return 200;
  }

  # ---- FRONTEND SPA ----
  # Deep-linking: si no existe el archivo estático, entrega index.html (no tocar API)
  #location / {
  #  try_files $uri /index.html;
  #}
  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://frontend:80/;   # usa :80 si tu contenedor sirve en 80
  }

  # ---- SSO detrás de /auth ----
  location /auth/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    #proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /auth;
    proxy_redirect ~^(/.*)$ /auth$1;   # <- clave para redirecciones correctas
    proxy_pass http://keycloak:8080/auth/;
  }

  # ---- APIs solo via Kong (/api) ----
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    #proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    # Propaga trazas W3C para que Kong/servicios encadenen spans
    proxy_set_header Traceparent $http_traceparent;
    proxy_set_header Tracestate $http_tracestate;
    proxy_set_header Authorization $http_authorization;

    proxy_pass http://kong:8000;
  }

  # ---- OpenTelemetry vía Kong -> Collector ----
  # El front publica a /otel/v1/traces; Kong hace strip_path a /v1/traces
  location /otel/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_pass http://kong:8000/otel/;
  }

  # Sirve el app.config.json CORRECTO desde el EDGE (no lo proxyees a ACA)
  location = /content/app.config.json {
    types { }                          # evita forzar text/plain
    default_type application/json;
    alias /etc/nginx/static/aca-app.config.json;
    add_header Cache-Control "no-store";
  }

  location = /content/assets/app.config.json {
    types { }
    default_type application/json;
    alias /etc/nginx/static/aca-app.config.json;
    add_header Cache-Control "no-store";
  }

  # ---- Alfresco Content App (SPA) ----
  # Redirige /content -> /content/ (sin barra no matchea el bloque)
  location = /content {
    return 301 /content/;
  }

  # Proxy simple: reemplaza /content/ por / en el upstream automáticamente
  location /content/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /content;

    proxy_set_header Accept-Encoding "";

    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store";


    # Reemplaza <base href="/"> -> <base href="/content/">
    sub_filter_once on;
    sub_filter_types text/html;
    #sub_filter '<base href="/">' '<base href="/content/">';
    sub_filter '<head>' '<head><base href="/content/">';
    #sub_filter '<HEAD>' '<HEAD><base href="/content/">';

    # NOTA: usa proxy_pass con "/" al final; NO uses rewrite aquí
    proxy_pass http://alfresco-content-app:8080/;
  }

  # ---- Alfresco Share ----
  location = /share {
    return 301 /share/;
  }

  location /share/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /share;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://alfresco-share:8080/share/;
  }


# ---- Alfresco Repository (backend) ----
# ACA hablará con ACS por aquí; evita CORS.
  location /alfresco/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # (opcional pero útil) Propaga Authorization si ACA lo envía
    proxy_set_header Authorization $http_authorization;

    #add_header X-Debug-Auth $http_authorization always;

    proxy_read_timeout 300s;         # operaciones pesadas (subidas, búsquedas)
    proxy_send_timeout 300s;

    # Permite uploads grandes
    client_max_body_size 100M;

    proxy_pass http://alfresco-repository:8080/alfresco/;

    # Endurecimiento básico
    #proxy_hide_header X-Powered-By;
    #add_header X-Frame-Options SAMEORIGIN;
    #add_header X-Content-Type-Options nosniff;
  }

# (Opcional, por seguridad) Bloquea acceso directo a Solr si alguien prueba la ruta
  location /solr/ { return 403; }

  # Bloquea acceso directo a ActiveMQ
  location /activemq/ {
    return 403;
  }

}

# =========================================
# SERVER INTERNO (NO PUBLICAR) :8081
# - Health simple y stub_status para exporter
# =========================================
server {
  listen 8081;                  # No mapear este puerto al host
  server_name _;

  # Endpoint de salud mínimo para checks internos
  location = /healthz {
    access_log off;
    add_header Cache-Control "no-store";
    return 200;
  }

  # Métricas básicas de Nginx (stub_status)
  # Este endpoint NO es formato Prometheus. Úsalo con nginx-prometheus-exporter.
  location = /nginx_status {
    stub_status;
    access_log off;

    # Restringe a redes internas (ajusta a tus subredes docker)
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
  }
}
