# ============================================
# CONFIGURACIÓN NGINX EDGE PROXY - CON KONG
# ============================================

# ========== SERVIDOR HTTP ==========
server {
    listen 80;
    server_name _;

    # Configuración de resolver DNS dinámico
    resolver 127.0.0.11 valid=30s;

    # Variable para Kong
    set $kong_gateway kong:8000;
    set $keycloak_server keycloak:8080;

    # Aumentar límites para archivos grandes
    client_max_body_size 100M;

    # ========== ENDPOINTS DE SALUD ==========

    # Health check (NO depende de Kong)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Nginx status (solo para monitoreo)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # Redes Docker
        deny all;
    }

    # ========== RUTAS DE KEYCLOAK (SSO) ==========

    # Proxy directo a Keycloak para autenticación
    location /auth/ {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://$keycloak_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts específicos para auth
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Rutas específicas de Keycloak
    location /realms/ {
        limit_req zone=api burst=10 nodelay;

        proxy_pass http://$keycloak_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== RUTAS CON PROXY A KONG ==========

    # API Routes - Rate limiting más permisivo
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://$kong_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Manejo de errores
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    # Auth/Login routes - Rate limiting más estricto
    #location /auth/ {
    #    limit_req zone=login burst=5 nodelay;

 #       proxy_pass http://$kong_gateway;
 #       proxy_set_header Host $host;
 #       proxy_set_header X-Real-IP $remote_addr;
 #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 #       proxy_set_header X-Forwarded-Proto $scheme;

        # Manejo de errores
 #       proxy_intercept_errors on;
 #       error_page 502 503 504 = @fallback;
 #   }

    # Todas las demás rutas
    location / {
        limit_req zone=api burst=15 nodelay;

        proxy_pass http://$kong_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_set_header X-Forwarded-Host $server_name;

        # Manejo de errores
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback;
    }

    # Fallback cuando Kong no está disponible
    #location @fallback {
    #    return 503 "Service temporarily unavailable - Kong Gateway not ready\n";
    #    add_header Content-Type text/plain;
    #}

    location @api_fallback {
        return 503 "API temporarily unavailable\n";
        add_header Content-Type text/plain;
    }

    location @app_fallback {
        return 503 "Application temporarily unavailable\n";
        add_header Content-Type text/plain;
    }

}
