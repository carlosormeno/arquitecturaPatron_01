version: '3.8'

services:
  # ============================================
  # BASE DE DATOS PARA KEYCLOAK BITNAMI
  # ============================================
  keycloak-bitnami-db:
    image: postgres:15
    container_name: keycloak-bitnami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_bitnami
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_data:/var/lib/postgresql/data
      - ./logs/keycloak/bitnami/db:/var/log/postgresql
    networks:
      - identity
      - backend
    ports:
      - "5438:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_bitnami"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # BASE DE DATOS PARA KEYCLOAK OFICIAL
  # ============================================
  keycloak-official-db:
    image: postgres:15
    container_name: keycloak-official-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak_official
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_data1:/var/lib/postgresql/data
      - ./logs/keycloak/official/db:/var/log/postgresql
    networks:
      - identity
      - backend
    ports:
      - "5439:5432"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_official"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # KEYCLOAK BITNAMI
  # ============================================
  keycloak-bitnami:
    image: bitnami/keycloak:26.3.1
    container_name: keycloak-bitnami
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      # Database Configuration
      KEYCLOAK_DATABASE_HOST: keycloak-bitnami-db
      KEYCLOAK_DATABASE_PORT: 5432
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: keycloak
      KEYCLOAK_DATABASE_PASSWORD: keycloak123
     # Admin Configuration
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      # Server Configuration
      KEYCLOAK_HTTP_ENABLED: "true"
      KEYCLOAK_HOSTNAME_STRICT: "false"
      KEYCLOAK_PROXY: edge
      KEYCLOAK_HTTP_RELATIVE_PATH: /auth

      KEYCLOAK_HOSTNAME: localhost
      KEYCLOAK_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ENABLE_STATISTICS: "true"
      KEYCLOAK_LOG_LEVEL: INFO
      #KEYCLOAK_FRONTEND_URL: http://localhost/auth
      KEYCLOAK_FRONTEND_URL: http://localhost:8085/auth

      #KEYCLOAK_HOSTNAME_URL: http://localhost:8080/auth
      KEYCLOAK_HOSTNAME_ADMIN_URL: http://localhost:8085/auth
      #KEYCLOAK_ENABLE_STATISTICS: "true"
      # Performance
      #KEYCLOAK_CACHE_STACK: tcp

      # --- Quarkus/hostnames (usa las KC_* oficiales) ---
      #KC_HTTP_ENABLED: "true"
      #KC_HOSTNAME: "localhost"
      #KC_HTTP_RELATIVE_PATH: /auth
      #KC_PROXY: edge

      #  hostname público (para el navegador) y back-channel (para contenedores)
      #KC_HOSTNAME_URL: http://localhost:8080/auth
      #KC_HOSTNAME_ADMIN_URL: http://localhost:8080/auth
      #KC_HOSTNAME_STRICT: "false"
      #KC_HEALTH_ENABLED: "true"
      #KC_METRICS_ENABLED: "true"

      #KEYCLOAK_ENABLE_STATISTICS: "true"
      #KEYCLOAK_LOG_LEVEL: INFO
    volumes:
      - ./logs/keycloak/bitnami/app:/opt/bitnami/keycloak/logs
    networks:
      - identity
      - backend
      - frontend
    depends_on:
      keycloak-bitnami-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:9000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ============================================
  # KEYCLOAK OFICIAL
  # ============================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-official-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123

      # Admin Configuration
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      # Server Configuration
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: INFO

      # Frontend URLs
      #KC_HOSTNAME_URL: http://localhost:8085/auth
      #KC_HOSTNAME_ADMIN_URL: http://localhost:8085/auth

      KC_HOSTNAME_URL: http://localhost/auth
      KC_HOSTNAME_ADMIN_URL: http://localhost/auth

      # Performance and caching
      KC_CACHE_STACK: tcp

    command: start-dev
    volumes:
      - ./logs/keycloak/official/app:/opt/keycloak/logs
    networks:
      - identity
      - backend
      - frontend
    depends_on:
      keycloak-official-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
        reservations:
          cpus: '1'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8080/auth/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

# ============================================
# NETWORKS
# ============================================
networks:
  identity:
    driver: bridge
    name: identity_network
    external: true
  backend:
    driver: bridge
    name: backend_network
    external: true
  frontend:
    driver: bridge
    name: frontend_network
    external: true

# ============================================
# VOLUMES
# ============================================
volumes:
  keycloak_data:
    name: keycloak_data
    external: true
  keycloak_data1:
    name: keycloak_data1
    external: true
